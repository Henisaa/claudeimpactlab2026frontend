name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Contraste WCAG de la paleta, leído de los tokens reales de globals.css.
      - run: npm run contraste
      # Next.js genera aquí los tipos (p. ej. LayoutProps) y compila TypeScript.
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # INFORMATIVO por ahora: hay 6 errores heredados de las reglas del compilador
    # de React (react-hooks/set-state-in-effect, purity). Ver Bugs_y_Deuda #18 en el
    # vault. Quitar `continue-on-error` cuando esa deuda esté saldada.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falla con vulnerabilidades altas o críticas en dependencias de producción.
      - run: npm audit --omit=dev --audit-level=high

  accesibilidad:
    name: Accesibilidad (axe + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pasó por primera vez en GitHub el 2026-09-27 (Chromium, backend público).
    # Se mantiene INFORMATIVO mientras el backend sea privado: clonarlo exige el
    # secreto BACKEND_REPO_TOKEN (ver más abajo). Cuando el secreto exista y el
    # job pase, quitar `continue-on-error`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Henisaa/claudeimpactlab2026backend
          path: backend
          # Con el backend privado hace falta un token con permiso de lectura:
          # crear el secreto BACKEND_REPO_TOKEN (PAT de grano fino, solo
          # "Contents: read" sobre el repo del backend). Sin él, cae al token
          # por defecto, que solo sirve si el backend es público.
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Backend (datos demo, Claude simulado)
        working-directory: backend
        run: |
          npm ci
          node src/seed.js
          CORS_ORIGINS=http://localhost:3100 nohup node src/server.js > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/salud && break || sleep 1; done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: |
            playwright-report/
            test-results/
            backend.log
